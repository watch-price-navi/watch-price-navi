# Instagram への接続を手動で確かめるためだけの実行。
#
# 毎日の本番（update-prices.yml）は価格収集に3時間かかるため、
# 投稿が失敗した理由を知りたいだけのときに回すと待たされる。
# こちらは1分で終わり、失敗の理由をそのままログに出す。
#
# 使い方: GitHub の Actions タブ → この実行を選ぶ → Run workflow
name: Instagram check

on:
  workflow_dispatch:
    inputs:
      date:
        description: '投稿する日付（空なら日本時間の今日）'
        required: false
        default: ''
      publish:
        description: '実際に投稿する。false なら接続確認だけ'
        type: boolean
        required: false
        default: false

# 本番の公開(pages)とは別枠にする。走っている収集を待たされないため。
concurrency:
  group: instagram-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # トークンの自動更新に使う鍵を先に確かめる。
      # 実際に書き戻しが起きるのは投稿した回だけなので、放っておくと
      # 鍵の不備は「60日後に投稿が止まって初めて分かる」ことになる。
      # 値は読まず、Secretsの一覧が引けるかどうかだけを見る。
      - name: Check GH_PAT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT が未設定です。トークンの自動更新は働きません。"
            echo "  投稿自体は動きますが、約60日後に手作業での再発行が必要になります。"
            exit 0
          fi
          if gh secret list --repo "${{ github.repository }}" > /tmp/secrets.txt 2>/tmp/err.txt; then
            echo "GH_PAT は有効です。登録されている Secrets:"
            cut -f1 /tmp/secrets.txt | sed 's/^/  - /'
          else
            echo "::error::GH_PAT では Secrets を操作できません。"
            cat /tmp/err.txt
            echo "  権限が Secrets: Read and write になっているか、"
            echo "  対象リポジトリが watch-price-navi/watch-price-navi になっているか確認してください。"
            exit 1
          fi

      # トークン自体が生きているかを先に見る。
      # ここで失敗するなら投稿以前の問題で、Metaアプリ側の設定を直す必要がある。
      #
      # 入口が2種類あり、トークンの見た目で判別する。
      #   IGAA… → Instagramログイン経由 (graph.instagram.com)
      #   それ以外 → Facebookページ経由 (graph.facebook.com)
      - name: Check token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::error::IG_ACCESS_TOKEN が Secrets に設定されていません。"
            exit 1
          fi
          echo "トークンの長さ: ${#IG_ACCESS_TOKEN} 文字"
          case "$IG_ACCESS_TOKEN" in
            IGAA*) API=https://graph.instagram.com/v21.0; TARGET=me;   echo "経路: Instagramログイン" ;;
            *)     API=https://graph.facebook.com/v21.0;  TARGET="$IG_USER_ID"; echo "経路: Facebookページ" ;;
          esac
          if [ -z "$TARGET" ]; then
            echo "::error::IG_USER_ID が Secrets に設定されていません。"
            exit 1
          fi
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' \
            "$API/$TARGET?fields=id,username,media_count&access_token=$IG_ACCESS_TOKEN")
          echo "HTTP $code"
          # トークンそのものは出力しない。応答だけを見せる
          cat /tmp/me.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::トークンでアカウント情報を取得できません。上の error.message を見てください。"
            # Facebook経由なら、どのページにどのInstagramが紐づいているかを併せて出す。
            # IG_USER_ID の取り違えが最も多い失敗なので、その場で正解を見せる。
            if [ "$API" = "https://graph.facebook.com/v21.0" ]; then
              echo "--- 参考: このトークンで見えるページとInstagram ---"
              curl -s "$API/me/accounts?fields=name,instagram_business_account{id,username}&access_token=$IG_ACCESS_TOKEN"
              echo
            fi
            exit 1
          fi

      # 入力値は env 経由で渡す。run: に直接埋め込むとシェルに解釈される
      - name: Post
        if: ${{ inputs.publish }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_OUT: ${{ runner.temp }}/ig_token.txt
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            node scripts/post-to-instagram.mjs --date "$DATE"
          else
            node scripts/post-to-instagram.mjs
          fi

      # 本番と同じく、延長されたトークンを Secrets に書き戻す。
      # ここで確かめられれば、毎日の実行でも同じように動く。
      - name: Save refreshed Instagram token
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="${{ runner.temp }}/ig_token.txt"
          if [ ! -s "$f" ]; then
            echo "更新されたトークンはありません。"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT が未設定のため、更新されたトークンを保存できません。"
            rm -f "$f"
            exit 0
          fi
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < "$f"
          rm -f "$f"
          echo "IG_ACCESS_TOKEN を更新しました。"

      - name: Dry run
        if: ${{ !inputs.publish }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            node scripts/post-to-instagram.mjs --date "$DATE" --dry-run
          else
            node scripts/post-to-instagram.mjs --dry-run
          fi
