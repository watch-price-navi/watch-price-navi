# 1日2回（JST 6:00 / 18:00）価格を自動収集し、朝はブログ記事も生成してサイトを公開する
name: Update prices & deploy

on:
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = JST 6:00（朝の回：ブログ生成 + 新作検出あり）
    - cron: '0 9 * * *'  # UTC 09:00 = JST 18:00（夕方の回：価格のみ更新）
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog data
        run: npm run validate

      # 朝の回（および手動実行・push）でのみブログを1本生成する
      # ブログは失敗しても価格更新とデプロイを止めない
      - name: Generate today's blog post
        if: github.event.schedule != '0 9 * * *'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
        run: node scripts/generate-blog.mjs

      - name: Commit new blog post
        if: github.event.schedule != '0 9 * * *'
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/blog
          if git diff --cached --quiet; then
            echo "No new post"
          else
            git commit -m "post: $(TZ=Asia/Tokyo date +%Y-%m-%d) の記事を追加 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # ブランド単位で出品を一括走査し、カタログ(未収録型番)と価格を同時に生成する。
      # モデル数が増えても実行時間が伸びない、この構成の中核ステップ。
      - name: Sweep listings (catalog + prices)
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          # 楽天新APIの必須Originヘッダ。未登録なら NEXT_PUBLIC_SITE_URL が使われる
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          VC_SID: ${{ secrets.VC_SID }}
          VC_PID: ${{ secrets.VC_PID }}
        # 毎日の実行はGitHub Actionsの6時間制限に収まるよう控えめな深さにする。
        # より深く掘りたいときは手元で引数なし（既定の最大深度）で実行する。
        run: node scripts/build-auto-catalog.mjs --pages 3 --yahoo-pages 2 --max-keywords 12

      - name: Commit auto catalog
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/brands-auto
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: 自動カタログを更新 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # 一括走査で拾えなかったモデルを型番キーワードで個別補完する（時間予算内で打ち切り）
      # 価格データ自体はリポジトリに保存せずビルドにのみ使う
      # （楽天APIの「取得データの恒久保存・再配布禁止」規約への対応）
      - name: Fill remaining prices
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          VC_SID: ${{ secrets.VC_SID }}
          VC_PID: ${{ secrets.VC_PID }}
        run: node scripts/fetch-prices.mjs --max-minutes 100

      # 未収録の新作型番を検出して data/pending-models.json に記録（朝の回のみ）
      - name: Discover new models
        if: github.event.schedule != '0 9 * * *'
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: node scripts/discover-models.mjs

      - name: Commit new-model candidates
        if: github.event.schedule != '0 9 * * *'
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pending-models.json
          if git diff --cached --quiet; then
            echo "No new candidates"
          else
            git commit -m "chore: 新作モデル候補を更新 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # 公開URL未設定のまま example.com の canonical/sitemap で公開してしまう事故を防ぐ
      - name: Check required settings
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL が未設定です。リポジトリの Settings → Secrets and variables → Actions → Variables に登録してください（docs/セットアップ手順.md の STEP 6）"
            exit 1
          fi

      - name: Build site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT }}
          NEXT_PUBLIC_VC_PID: ${{ vars.NEXT_PUBLIC_VC_PID }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
