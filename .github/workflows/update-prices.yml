# 1日2回（JST 6:20 / 18:20）価格を自動収集し、朝はブログ記事も生成してサイトを公開する
name: Update prices & deploy

on:
  # 毎時0分は世界中の実行が集中し、GitHubの定期実行が後回しにされる
  # （実測で朝53分・夕方51分の遅れ）。20分ずらしてピークを外す。
  schedule:
    # どちらの回も「収集 → 掃除 → ビルド → 公開」まで通す。1日2回サイトが更新される。
    # 1回あたり約200分かかる（実測: 朝203分 / 夕198分）。
    - cron: '20 21 * * *' # UTC 21:20 = JST 6:20（朝：ブログ生成・写真収集・新作検出あり）
    - cron: '20 9 * * *'  # UTC 09:20 = JST 18:20（夕：朝だけでよい処理を省いた分、少し速い）
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # 進行中の実行を絶対に止めない。
  # 以前 true にしていたため、価格収集(2〜3時間)の最中にコードを push すると
  # 収集ごと打ち切られ、価格も画像も入らないまま公開される事故が3回起きた。
  # 待たされるのは不便だが、走っている仕事を殺すよりはるかにましである。
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    # 価格の収集は数時間かかる。コードを直しただけの push でそれを待たされると、
    # 修正が公開されるまで半日かかってしまう。
    #   push          → 収集を飛ばして即デプロイ（数分で反映される）
    #   schedule/手動 → 収集込みのフル実行
    env:
      FULL_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog data
        run: npm run validate

      # 朝の回（および手動実行・push）でのみブログを1本生成する
      # ブログは失敗しても価格更新とデプロイを止めない
      - name: Generate today's blog post
        if: github.event.schedule != '20 9 * * *'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
        run: node scripts/generate-blog.mjs

      # 日本語の字が入った投稿画像を作るため、ランナーに日本語フォントを入れる。
      # 無いと文字が豆腐（□）になり、そのまま投稿されてしまう
      - name: Install Japanese fonts
        if: github.event.schedule != '20 9 * * *'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # 実際に検索で見られているモデルを取り込む。
      # これが無いと「誰も見ていないモデルの写真を集め、よく見られているモデルの
      # 写真がいつまでも無い」ということが起きる。写真収集より先に走らせる。
      # 鍵が未設定でも止まらない（既定の順で進む）。
      - name: Fetch Search Console stats
        if: github.event.schedule != '20 9 * * *'
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: node scripts/fetch-search-console.mjs --days 28

      # 時計の実写を少しずつ集める。1本の時計を裏蓋・側面・留め金と見せる
      # カルーセル投稿の材料になる。相手（Wikimedia / Openverse）に負担をかけない
      # よう1回12モデルに留め、一度調べたモデルは30日空ける。
      # 楽天・Yahoo! の商品写真は規約 第10条により Instagram に使えないので、
      # CC / PD の写真を貯めるしかない。
      - name: Collect watch photos
        if: github.event.schedule != '20 9 * * *'
        continue-on-error: true
        env:
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: node scripts/fetch-watch-photos.mjs --limit 12

      # 朝の回で1日分（朝・昼・夜・ストーリー）の画像をまとめて作る。
      # Instagram は「公開URLの画像」しか受け付けないので、
      # 投稿の時刻に作るのでは間に合わない。先に作ってデプロイしておく。
      # 実際の投稿は .github/workflows/instagram.yml が 11:05 / 18:05 / 21:05 に行う。
      - name: Build Instagram post
        if: github.event.schedule != '20 9 * * *'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: |
          node scripts/build-instagram-post.mjs
          node scripts/build-instagram-extra.mjs

      - name: Commit new blog post
        if: github.event.schedule != '20 9 * * *'
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/blog data/social public/social data/watch-photos.json public/img/watches data/page-stats.json
          if git diff --cached --quiet; then
            echo "No new post"
          else
            git commit -m "post: $(TZ=Asia/Tokyo date +%Y-%m-%d) の記事を追加 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # ブランド単位で出品を一括走査し、カタログ(未収録型番)と価格を同時に生成する。
      # モデル数が増えても実行時間が伸びない、この構成の中核ステップ。
      - name: Sweep listings (catalog + prices)
        if: env.FULL_RUN == 'true'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          # 楽天新APIの必須Originヘッダ。未登録なら NEXT_PUBLIC_SITE_URL が使われる
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        # GitHub Actions の1回の実行は6時間で強制終了される。
        # 実測(2026-08-16)は 走査89分 + 価格100分 + 生成9分 + その他4分 = 202分で、
        # 158分の余裕があった。掲載網羅を上げるため、その余裕を走査に回す。
        #
        # 深さを上げると上限に当たる危険が出るので、走査自身にも時間の上限を持たせた。
        # 当たった場合は走査できなかったブランドを警告で知らせる（常態化させないため）。
        #
        # 2026-08-17: ブランドを39→67社に増やした。
        # 1社あたり2.3分（実測89分/39社）なので、67社では153分かかる計算になり、
        # 150分の上限に当たって後ろのブランドが走査されないことになる。
        # ブランドはアルファベット順なので、当たると毎日同じ社（tissot〜zenith）が
        # 落ち続ける。上限を185分に引き上げた。
        # 見積り: 走査185分 + 価格100分 + 生成9分 + その他4分 = 298分（6時間に対し余裕62分）
        run: node scripts/build-auto-catalog.mjs --pages 4 --yahoo-pages 3 --max-keywords 20 --max-minutes 185

      - name: Commit auto catalog
        if: env.FULL_RUN == 'true'
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/brands-auto
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: 自動カタログを更新 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # 一括走査で拾えなかったモデルを型番キーワードで個別補完する（時間予算内で打ち切り）
      # 価格データ自体はリポジトリに保存せずビルドにのみ使う
      # （楽天APIの「取得データの恒久保存・再配布禁止」規約への対応）
      - name: Fill remaining prices
        if: env.FULL_RUN == 'true'
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: node scripts/fetch-prices.mjs --max-minutes 100

      # カタログの掃除。価格が揃ったあとに行う。
      # 「その型番の出品が全部ゴミ」かどうかは価格データが無いと判断できないため、
      # 収集の前にやっても効かない。判定は scripts/lib/junk.mjs に一本化してある。
      - name: Prune junk from catalog
        if: env.FULL_RUN == 'true'
        continue-on-error: true
        run: |
          node scripts/test-junk.mjs
          node scripts/prune-auto-catalog.mjs --apply

      - name: Commit pruned catalog
        if: env.FULL_RUN == 'true'
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/brands-auto
          if git diff --cached --quiet; then
            echo "掃除するものはありませんでした"
          else
            git commit -m "chore: カタログからゴミを除去 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # 海外の出品価格。国内の店と同じ表に「eBay（海外）」の行として並べる
      # （2026-08-19、運営の指示。円換算は概算と明記し、送料・関税の注記を必ず出す）。
      # eBayに「利用者のデータを保持しない」と申告して免除を受けているので、
      # 出品者名は取得も保存もしない（scripts/fetch-ebay.mjs の注記を参照）。
      # ランナーは毎回まっさらで前回の結果を持たないため、全型番（約830件）を毎回調べる。
      # 実測10分前後。1日5,000回の枠には 830×2回 で十分収まる。
      - name: Fetch eBay reference prices
        if: env.FULL_RUN == 'true'
        continue-on-error: true
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_CAMPAIGN_ID: ${{ vars.EBAY_CAMPAIGN_ID }}
        run: node scripts/fetch-ebay.mjs --limit 900 --max-minutes 25

      # 未収録の新作型番を検出して data/pending-models.json に記録（朝の回のみ）
      - name: Discover new models
        if: env.FULL_RUN == 'true' && (github.event.schedule != '20 9 * * *')
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: node scripts/discover-models.mjs

      - name: Commit new-model candidates
        if: env.FULL_RUN == 'true' && (github.event.schedule != '20 9 * * *')
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pending-models.json
          if git diff --cached --quiet; then
            echo "No new candidates"
          else
            git commit -m "chore: 新作モデル候補を更新 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # 公開URL未設定のまま example.com の canonical/sitemap で公開してしまう事故を防ぐ
      - name: Check required settings
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL が未設定です。リポジトリの Settings → Secrets and variables → Actions → Variables に登録してください（docs/セットアップ手順.md の STEP 6）"
            exit 1
          fi

      - name: Build site
        env:
          # 29,000ページの静的生成はNodeの既定ヒープ(約2GB)を超える。
          # 未設定だとビルドがメモリ不足で落ち、デプロイまで到達しない
          # （手元では 0xC0000409 で落ちた）。GitHubランナーは7GBなので6GB割り当てる
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT }}
          NEXT_PUBLIC_VC_PID: ${{ vars.NEXT_PUBLIC_VC_PID }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: npm run build

      # 価格が入っていないビルドで公開してはいけない。
      # push では価格収集を飛ばすため、そのまま公開すると価格も画像も無いサイトが
      # 良い版を上書きしてしまう。価格データの有無を見て公開の可否を決める。
      - name: Check price data before deploying
        id: pricecheck
        run: |
          if [ -s data/prices/summary.json ] && [ "$(node -p "Object.keys(require('./data/prices/summary.json')).length")" -gt 0 ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "価格データあり。公開します"
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "::warning::価格データが無いため公開を見送りました（ビルドの検証のみ）。次の定期実行で価格つきで公開されます"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pricecheck.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pricecheck.outputs.deploy == 'true'
        with:
          path: out

      - uses: actions/deploy-pages@v4
        if: steps.pricecheck.outputs.deploy == 'true'

      # Instagram は「公開URLの画像」しか受け付けないので、必ずデプロイ後に投稿する。
      # 先に呼ぶと画像がまだ404で、投稿が必ず失敗する。
      # 朝の回だけ（1日1投稿）。失敗してもサイトの更新は止めない。
      # continue-on-error は付けない。
      # 以前は付けたうえにループの終了状態が echo のものになっていたため、
      # 6回とも失敗しても「成功」と表示され、1件も投稿されていないことに
      # 気づくまで日数がかかった。投稿できなければ赤くする。
      # 実際の投稿は .github/workflows/instagram.yml が行う。
      # 1日3回（11:05 / 18:05 / 21:05）＋ストーリー。
      # ここから投稿していたときは1日1回で、しかも200分の収集を待つ必要があった。

      # Instagram トークンの延長と Secrets への書き戻しは、投稿を行う
      # instagram.yml に移した。ここには何も残っていない。
      # （以前ここに書き戻しステップだけが残り、延長する者が誰もいない状態になっていた。
      #   投稿と延長は必ず同じワークフローに置くこと）
