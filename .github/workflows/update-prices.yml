# 1日2回（JST 6:20 / 18:20）価格を自動収集し、朝はブログ記事も生成してサイトを公開する
name: Update prices & deploy

on:
  # 毎時0分は世界中の実行が集中し、GitHubの定期実行が後回しにされる
  # （実測で朝53分・夕方51分の遅れ）。20分ずらしてピークを外す。
  schedule:
    - cron: '20 21 * * *' # UTC 21:20 = JST 6:20（朝の回：ブログ生成 + 新作検出あり）
    - cron: '20 9 * * *'  # UTC 09:20 = JST 18:20（夕方の回：価格のみ更新）
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # 進行中の実行を絶対に止めない。
  # 以前 true にしていたため、価格収集(2〜3時間)の最中にコードを push すると
  # 収集ごと打ち切られ、価格も画像も入らないまま公開される事故が3回起きた。
  # 待たされるのは不便だが、走っている仕事を殺すよりはるかにましである。
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    # 価格の収集は数時間かかる。コードを直しただけの push でそれを待たされると、
    # 修正が公開されるまで半日かかってしまう。
    #   push          → 収集を飛ばして即デプロイ（数分で反映される）
    #   schedule/手動 → 収集込みのフル実行
    env:
      FULL_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog data
        run: npm run validate

      # 朝の回（および手動実行・push）でのみブログを1本生成する
      # ブログは失敗しても価格更新とデプロイを止めない
      - name: Generate today's blog post
        if: github.event.schedule != '20 9 * * *'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
        run: node scripts/generate-blog.mjs

      # 日本語の字が入った投稿画像を作るため、ランナーに日本語フォントを入れる。
      # 無いと文字が豆腐（□）になり、そのまま投稿されてしまう
      - name: Install Japanese fonts
        if: github.event.schedule != '20 9 * * *'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Build Instagram post
        if: github.event.schedule != '20 9 * * *'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: node scripts/build-instagram-post.mjs

      - name: Commit new blog post
        if: github.event.schedule != '20 9 * * *'
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/blog data/social public/social
          if git diff --cached --quiet; then
            echo "No new post"
          else
            git commit -m "post: $(TZ=Asia/Tokyo date +%Y-%m-%d) の記事を追加 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # ブランド単位で出品を一括走査し、カタログ(未収録型番)と価格を同時に生成する。
      # モデル数が増えても実行時間が伸びない、この構成の中核ステップ。
      - name: Sweep listings (catalog + prices)
        if: env.FULL_RUN == 'true'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          # 楽天新APIの必須Originヘッダ。未登録なら NEXT_PUBLIC_SITE_URL が使われる
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          VC_SID: ${{ secrets.VC_SID }}
          VC_PID: ${{ secrets.VC_PID }}
        # 毎日の実行はGitHub Actionsの6時間制限に収まるよう控えめな深さにする。
        # より深く掘りたいときは手元で引数なし（既定の最大深度）で実行する。
        run: node scripts/build-auto-catalog.mjs --pages 3 --yahoo-pages 2 --max-keywords 12

      - name: Commit auto catalog
        if: env.FULL_RUN == 'true'
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/brands-auto
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: 自動カタログを更新 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # 一括走査で拾えなかったモデルを型番キーワードで個別補完する（時間予算内で打ち切り）
      # 価格データ自体はリポジトリに保存せずビルドにのみ使う
      # （楽天APIの「取得データの恒久保存・再配布禁止」規約への対応）
      - name: Fill remaining prices
        if: env.FULL_RUN == 'true'
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          VC_SID: ${{ secrets.VC_SID }}
          VC_PID: ${{ secrets.VC_PID }}
        run: node scripts/fetch-prices.mjs --max-minutes 100

      # 未収録の新作型番を検出して data/pending-models.json に記録（朝の回のみ）
      - name: Discover new models
        if: env.FULL_RUN == 'true' && (github.event.schedule != '20 9 * * *')
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_GENRE_ID: ${{ vars.RAKUTEN_GENRE_ID }}
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: node scripts/discover-models.mjs

      - name: Commit new-model candidates
        if: env.FULL_RUN == 'true' && (github.event.schedule != '20 9 * * *')
        continue-on-error: true
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pending-models.json
          if git diff --cached --quiet; then
            echo "No new candidates"
          else
            git commit -m "chore: 新作モデル候補を更新 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # 公開URL未設定のまま example.com の canonical/sitemap で公開してしまう事故を防ぐ
      - name: Check required settings
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL が未設定です。リポジトリの Settings → Secrets and variables → Actions → Variables に登録してください（docs/セットアップ手順.md の STEP 6）"
            exit 1
          fi

      - name: Build site
        env:
          # 29,000ページの静的生成はNodeの既定ヒープ(約2GB)を超える。
          # 未設定だとビルドがメモリ不足で落ち、デプロイまで到達しない
          # （手元では 0xC0000409 で落ちた）。GitHubランナーは7GBなので6GB割り当てる
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT }}
          NEXT_PUBLIC_VC_PID: ${{ vars.NEXT_PUBLIC_VC_PID }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: npm run build

      # 価格が入っていないビルドで公開してはいけない。
      # push では価格収集を飛ばすため、そのまま公開すると価格も画像も無いサイトが
      # 良い版を上書きしてしまう。価格データの有無を見て公開の可否を決める。
      - name: Check price data before deploying
        id: pricecheck
        run: |
          if [ -s data/prices/summary.json ] && [ "$(node -p "Object.keys(require('./data/prices/summary.json')).length")" -gt 0 ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "価格データあり。公開します"
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "::warning::価格データが無いため公開を見送りました（ビルドの検証のみ）。次の定期実行で価格つきで公開されます"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pricecheck.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pricecheck.outputs.deploy == 'true'
        with:
          path: out

      - uses: actions/deploy-pages@v4
        if: steps.pricecheck.outputs.deploy == 'true'

      # Instagram は「公開URLの画像」しか受け付けないので、必ずデプロイ後に投稿する。
      # 先に呼ぶと画像がまだ404で、投稿が必ず失敗する。
      # 朝の回だけ（1日1投稿）。失敗してもサイトの更新は止めない。
      # continue-on-error は付けない。
      # 以前は付けたうえにループの終了状態が echo のものになっていたため、
      # 6回とも失敗しても「成功」と表示され、1件も投稿されていないことに
      # 気づくまで日数がかかった。投稿できなければ赤くする。
      - name: Post to Instagram
        if: steps.pricecheck.outputs.deploy == 'true' && github.event.schedule != '20 9 * * *'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_OUT: ${{ runner.temp }}/ig_token.txt
        run: |
          # GitHub Pages の反映には少し間がある。画像が取得できるまで待つ
          for i in 1 2 3 4 5 6; do
            sleep 30
            if node scripts/post-to-instagram.mjs; then
              exit 0
            fi
            echo "リトライ $i/6"
          done
          echo "::error::Instagram への投稿が6回とも失敗しました。上のログの理由を確認してください。"
          exit 1

      # Instagram のトークンは60日で切れる。延長すると別の値が返るので、
      # それを Secrets に書き戻さないと、いま登録されている方が期限切れになり
      # 投稿が止まる。毎日書き戻すことで実質無期限になる。
      #
      # 投稿が失敗した回でも、トークンだけ更新できていれば保存する（always）。
      # gh はランナーに最初から入っているので追加の依存はない。
      - name: Save refreshed Instagram token
        if: always()
        continue-on-error: true
        env:
          # secrets は if: では参照できないので、シェルの中で空かどうかを見る
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="${{ runner.temp }}/ig_token.txt"
          if [ ! -s "$f" ]; then
            echo "更新されたトークンはありません。"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT が未設定のため、更新されたトークンを保存できません。"
            echo "::warning::このままでは現在のトークンが期限切れになると投稿が止まります。"
            rm -f "$f"
            exit 0
          fi
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < "$f"
          rm -f "$f"
          echo "IG_ACCESS_TOKEN を更新しました。"
